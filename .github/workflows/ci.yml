name: API CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Node.js API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js

      - name: Simulate validation failure
        run: |
          echo "Simulating a validation failure"
          exit 1

  build:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-user-api:ci .
